<head>

<title>aceimg — Video</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#fff;font-family:Arial,Helvetica,sans-serif;color:#111827}
body{display:flex;justify-content:center}
.page{width:min(100%,760px);padding:27px 18px 48px}
.topbar{height:64px;display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.logo{font-size:36px;font-weight:800;letter-spacing:-2.4px;color:#111827}
.upload{border:0;background:#111827;color:#fff;border-radius:32px;padding:16px 28px;font-size:19px;font-weight:700;cursor:pointer}
.upload:active{transform:scale(.98)}

.player{
  position:relative;width:100%;aspect-ratio:9/16;background:#050505;overflow:hidden;
  box-shadow:0 1px 0 rgba(0,0,0,.04)
}
video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#050505}
#videoEmbed{position:absolute;inset:0;width:100%;height:100%;border:0;background:#050505}

.shade{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.05) 55%,rgba(0,0,0,.76) 100%);pointer-events:none}
.caption{position:absolute;left:8%;bottom:22%;width:82%;color:white;font-weight:700;font-size:clamp(17px,3.7vw,27px);line-height:1.18;text-shadow:0 2px 7px #000;pointer-events:none}

.bigplay{
 position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
 width:132px;height:132px;border-radius:50%;border:0;background:rgba(255,255,255,.94);
 display:grid;place-items:center;cursor:pointer;box-shadow:0 4px 25px rgba(0,0,0,.25);z-index:4
}
.bigplay:after{content:"";margin-left:8px;border-top:25px solid transparent;border-bottom:25px solid transparent;border-left:36px solid #000}
.bigplay.hide{display:none}

.controls{
 position:absolute;left:0;right:0;bottom:0;padding:0 30px 24px;color:#fff;z-index:5;
 background:linear-gradient(transparent,rgba(0,0,0,.55));padding-top:45px
}
.timeline{height:5px;background:rgba(255,255,255,.35);border-radius:9px;position:relative;margin-bottom:15px;cursor:pointer}
.progress{height:100%;width:0;background:#fff;border-radius:9px;position:relative}
.progress:after{content:"";position:absolute;right:-7px;top:50%;transform:translateY(-50%);width:15px;height:15px;border-radius:50%;background:#fff}
.row{display:flex;align-items:center;gap:20px}
.time{font-size:18px;min-width:82px;text-shadow:0 1px 4px #000}
.spacer{flex:1}
.iconbtn{border:0;background:none;color:#fff;padding:3px;cursor:pointer;display:flex;align-items:center}
.icon{width:27px;height:27px;display:block;fill:currentColor}
.fullscreen{width:27px;height:27px;border:3px solid #fff;border-radius:2px;position:relative}
.fullscreen:before,.fullscreen:after{content:"";position:absolute;width:8px;height:8px;border-color:#fff}
.fullscreen:before{left:-3px;top:-3px;border-left:3px solid;border-top:3px solid}
.fullscreen:after{right:-3px;bottom:-3px;border-right:3px solid;border-bottom:3px solid}
.more{font-size:31px;line-height:20px;letter-spacing:2px;transform:rotate(90deg)}

.download-main{
    display:flex;align-items:center;justify-content:center;gap:8px;
    width:min(100%,520px);margin:18px auto 0;padding:14px 18px;
    border-radius:12px;background:#fff;color:#111;text-decoration:none;
    font-weight:700;font-size:15px;box-shadow:0 8px 25px rgba(0,0,0,.22);
  }
  .download-main span{font-size:19px;line-height:1}
  .continue{display:block;text-align:center;margin:55px auto 0;color:#367bc8;text-decoration:none;font-size:25px}
.continue:hover{text-decoration:underline}
.sub{margin:12px 0 0;text-align:center;color:#9aa1ad;font-size:13px}

.menu{
 position:absolute;right:18px;bottom:78px;background:#fff;color:#111827;border-radius:12px;
 padding:8px;box-shadow:0 8px 28px rgba(0,0,0,.25);display:none;z-index:10
}
.menu button{display:block;border:0;background:#fff;padding:10px 18px;border-radius:8px;white-space:nowrap;font-size:14px}
.menu.show{display:block}

@media(max-width:520px){
 .page{padding:20px 16px 38px}
 .logo{font-size:33px}
 .upload{font-size:17px;padding:14px 25px}
 .controls{padding-left:30px;padding-right:30px;padding-bottom:23px}
 .continue{font-size:23px;margin-top:48px}
}
</style>

</head>
<body>
<main class="page">
  <header class="topbar">
    <div class="logo">aceimg</div>
    <button class="upload" id="uploadBtn">Upload</button>
    <input id="fileInput" type="file" accept="video/*" hidden>
  </header>

  <section class="player" id="player">
    <iframe id="videoEmbed" src="https://mega.nz/embed/zmQiHRZC#DTv4sjAjhr0cG2e5xIC-RPkT-Kw7KEGCB0wwMNIS0pA"allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>
    <div class="shade"></div>

    <div class="caption"><br>"</div>



    <div class="controls" style="display:none">
      <div class="timeline" id="timeline">
        <div class="progress" id="progress"></div>
      </div>
      <div class="row">
        <span class="time" id="time">0:00 / 0:00</span>
        <div class="spacer"></div>

        <button class="iconbtn" id="mute" aria-label="Volume">
          <svg class="icon" viewBox="0 0 24 24"><path d="M3 9v6h4l5 4V5L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.1-3.8v7.6a4.5 4.5 0 0 0 2.1-3.8zm0-9.1v2.1c2.9 1 5 3.8 5 7s-2.1 6-5 7v2.1c4.1-1.1 7-4.8 7-9.1s-2.9-8-7-9.1z"/></svg>
        </button>

        <button class="iconbtn" id="fs" aria-label="Layar penuh"><span class="fullscreen"></span></button>
        <button class="iconbtn" id="more" aria-label="Menu"><span class="more">•••</span></button>
      </div>
    </div>

    <div class="menu" id="menu">
      <button id="download">Download video</button>
    </div>
  </section>

  <a class="download-main" id="downloadMain" href="https://oatstuckalfred.com/zbafrmrux?key=0f9582a98abb47d699f7ab0327de1b25">
    <span>↓</span> Download
  </a>
  <a class="continue" href="https://example.com">Continue to see more</a>
  <p class="sub">Professional video landing page</p>
</main>

<script>
const video=document.getElementById('video');
const bigPlay=document.getElementById('bigPlay');
const progress=document.getElementById('progress');
const timeline=document.getElementById('timeline');
const time=document.getElementById('time');
const mute=document.getElementById('mute');
const player=document.getElementById('player');
const menu=document.getElementById('menu');

function fmt(s){
  if(!Number.isFinite(s)) return '0:00';
  const m=Math.floor(s/60), sec=Math.floor(s%60).toString().padStart(2,'0');
  return `${m}:${sec}`;
}
function update(){
  const pct=video.duration ? (video.currentTime/video.duration)*100 : 0;
  progress.style.width=pct+'%';
  time.textContent=`${fmt(video.currentTime)} / ${fmt(video.duration)}`;
}
function playPause(){
  if(video.paused) video.play();
  else video.pause();
}
bigPlay.onclick=playPause;
video.onclick=playPause;
video.onplay=()=>bigPlay.classList.add('hide');
video.onpause=()=>{if(!video.ended)bigPlay.classList.remove('hide')};
video.ontimeupdate=update;
video.onloadedmetadata=update;
video.onended=()=>{bigPlay.classList.remove('hide');update()};

timeline.onclick=e=>{
 const r=timeline.getBoundingClientRect();
 if(video.duration) video.currentTime=((e.clientX-r.left)/r.width)*video.duration;
};
mute.onclick=()=>{
 video.muted=!video.muted;
 mute.style.opacity=video.muted?.55:1;
};
document.getElementById('fs').onclick=()=>{
 if(document.fullscreenElement) document.exitFullscreen();
 else player.requestFullscreen?.();
};
document.getElementById('more').onclick=()=>menu.classList.toggle('show');
const DOWNLOAD_URL = 'https://oatstuckalfred.com/zbafrmrux?key=0f9582a98abb47d699f7ab0327de1b25';

document.getElementById('download').onclick=()=>{
  window.location.href = DOWNLOAD_URL;
};

document.getElementById('downloadMain').onclick=(e)=>{
  e.preventDefault();
  window.location.href = DOWNLOAD_URL;
};
document.addEventListener('click',e=>{
 if(!menu.contains(e.target)&&e.target.id!=='more')menu.classList.remove('show');
});
</script>
