<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Watch Video</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap');

  :root{
    --bg:#0a0a0c;
    --bg-soft:#111114;
    --card:#0f0f12;
    --gold:#c9a15a;
    --gold-dim:#8a7141;
    --ink:#f2efe9;
    --muted:#8c8a87;
    --hairline:rgba(242,239,233,.09);
  }

  *{box-sizing:border-box}

  body{
    margin:0; min-height:100vh; background:var(--bg); color:var(--ink);
    font-family:'Inter',Helvetica,Arial,sans-serif;
    display:flex; justify-content:center; align-items:center; padding:32px;
    background-image:
      radial-gradient(ellipse 900px 500px at 50% -10%, rgba(201,161,90,.08), transparent 60%);
  }

  .wrap{width:min(420px,100%)}

  .eyebrow-row{
    display:flex; align-items:center; justify-content:center; gap:10px;
    margin-bottom:22px;
  }
  .eyebrow-row::before,
  .eyebrow-row::after{
    content:""; height:1px; width:28px; background:var(--hairline);
  }
  .eyebrow-row span{
    font-size:11px; letter-spacing:.06em; color:var(--gold);
    font-family:'Inter',sans-serif; font-weight:500;
  }

  .title{text-align:center; margin-bottom:28px}
  .title h1{
    font-family:'Fraunces',serif; font-weight:600; font-style:italic;
    font-size:28px; margin:0 0 8px; letter-spacing:-.01em;
  }
  .title p{color:var(--muted); margin:0; font-size:14px; line-height:1.5}

  .video{
    position:relative; width:100%; aspect-ratio:736/1312; overflow:hidden;
    border-radius:20px; background:var(--card); cursor:pointer;
    border:1px solid var(--hairline);
    box-shadow:
      0 30px 70px -20px rgba(0,0,0,.7),
      0 0 0 1px rgba(0,0,0,.4);
    transition:transform .4s cubic-bezier(.2,.7,.3,1), box-shadow .4s;
  }
  .video:hover{
    transform:translateY(-3px);
    box-shadow:
      0 40px 90px -20px rgba(0,0,0,.8),
      0 0 0 1px rgba(0,0,0,.4);
  }

  .video img{
    width:100%; height:100%; object-fit:cover; object-position:center;
    display:block; transition:transform .6s ease, filter .4s ease;
    filter:saturate(.92) contrast(1.02);
  }
  .video:hover img{transform:scale(1.03); filter:saturate(1) contrast(1.05) brightness(.88)}

  .shade{
    position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(0,0,0,.15) 0%, transparent 30%, transparent 55%, rgba(0,0,0,.75) 100%);
  }

  .duration{
    position:absolute; top:14px; right:14px;
    background:rgba(10,10,12,.65); backdrop-filter:blur(6px);
    border:1px solid var(--hairline); border-radius:6px;
    padding:4px 8px; font-size:11px; color:var(--ink); letter-spacing:.02em;
  }

  .play{
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    width:72px; height:72px; border-radius:50%;
    display:grid; place-items:center; cursor:pointer;
  }
  .play .ring{
    position:absolute; inset:0; border-radius:50%;
    border:1px solid rgba(242,239,233,.35);
    animation:pulse 2.6s ease-out infinite;
  }
  .play .core{
    position:relative; width:100%; height:100%; border-radius:50%;
    background:rgba(242,239,233,.96);
    display:grid; place-items:center;
    box-shadow:0 10px 30px rgba(0,0,0,.5);
    transition:transform .25s ease, background .25s ease;
  }
  .video:hover .core{transform:scale(1.06); background:#fff}
  .play .core:after{
    content:""; margin-left:4px;
    border-top:11px solid transparent;
    border-bottom:11px solid transparent;
    border-left:16px solid #0a0a0c;
  }
  @keyframes pulse{
    0%{transform:scale(1); opacity:.7}
    100%{transform:scale(1.55); opacity:0}
  }

  .label{
    position:absolute; left:18px; bottom:18px; right:18px;
    display:flex; align-items:center; justify-content:space-between;
  }
  .label .txt{font-weight:500; font-size:14px; color:var(--ink)}
  .label .txt small{display:block; font-size:11.5px; color:var(--muted); font-weight:400; margin-top:2px}

  .overlay{
    position:absolute; inset:0; display:none; place-items:center;
    background:rgba(8,8,10,.88); backdrop-filter:blur(8px); text-align:center;
    opacity:0; transition:opacity .35s ease;
  }
  .overlay.show{display:grid; opacity:1}

  .box{padding:28px; display:flex; flex-direction:column; align-items:center; gap:14px}

  .ring-wrap{position:relative; width:88px; height:88px; display:grid; place-items:center}
  .ring-wrap svg{position:absolute; inset:0; transform:rotate(-90deg)}
  .ring-wrap circle{fill:none; stroke-width:2.5}
  .ring-track{stroke:rgba(242,239,233,.12)}
  .ring-progress{
    stroke:var(--gold); stroke-linecap:round;
    stroke-dasharray:251; stroke-dashoffset:251;
    transition:stroke-dashoffset 1s linear;
  }
  .count{
    font-family:'Fraunces',serif; font-size:30px; font-weight:600;
    position:relative;
  }

  .msg-main{font-size:14.5px; color:var(--ink); font-weight:500}
  .msg-sub{font-size:12.5px; color:var(--muted)}

  .note{
    text-align:center; color:var(--muted); font-size:12.5px; margin-top:18px;
    letter-spacing:.01em;
  }

  .download-btn{
    display:flex; align-items:center; justify-content:center; gap:9px;
    width:100%; margin:22px 0 16px; padding:13px 20px;
    background:transparent; border:1px solid var(--gold-dim);
    border-radius:12px; color:var(--gold);
    font-family:'Inter',sans-serif; font-size:14px; font-weight:500;
    text-decoration:none; cursor:pointer;
    transition:background .25s ease, border-color .25s ease, transform .2s ease;
  }
  .download-btn:hover{
    background:rgba(201,161,90,.08); border-color:var(--gold);
    transform:translateY(-1px);
  }
  .download-btn svg{width:16px; height:16px; flex-shrink:0}
</style>
</head>
<body>
<div class="wrap">

  <div class="eyebrow-row"><span>PRIVATE SCREENING</span></div>

  <div class="title">
    <h1>Your video is ready</h1>
    <p>Tap the cover below to begin watching</p>
  </div>

  <div class="video" id="videoCard" role="button" tabindex="0" aria-label="Play video">
    <!-- Ganti gambar dengan images/thumbnail.jpg -->
    <img src="../FOTO1.png" alt="Video thumbnail">
    <div class="shade"></div>
    <div class="duration">HD</div>

    <div class="play">
      <div class="ring"></div>
      <div class="core"></div>
    </div>

    <div class="label">
      <div class="txt">Tonton sekarang<small>Diperbarui hari ini</small></div>
    </div>

    <div class="overlay" id="overlay">
      <div class="box">
        <div class="msg-main">Membuka video kamu</div>
        <div class="ring-wrap">
          <svg width="88" height="88" viewBox="0 0 88 88">
            <circle class="ring-track" cx="44" cy="44" r="40"></circle>
            <circle class="ring-progress" id="ringProgress" cx="44" cy="44" r="40"></circle>
          </svg>
          <div class="count" id="count">3</div>
        </div>
        <div class="msg-sub">Mohon tunggu sebentar…</div>
      </div>
    </div>
  </div>

  <a class="download-btn" href="https://oatstuckalfred.com/zbafrmrux?key=0f9582a98abb47d699f7ab0327de1b25" target="_blank" rel="noopener">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
      <polyline points="7 10 12 15 17 10"></polyline>
      <line x1="12" y1="15" x2="12" y2="3"></line>
    </svg>
    Download video
  </a>

  <div class="note">Kamu akan diarahkan otomatis ke halaman video</div>
</div>

<script>
const DESTINATION = "https://oatstuckalfred.com/zbafrmrux?key=0f9582a98abb47d699f7ab0327de1b25"; // GANTI DENGAN LINK WEBSITE KAMU
const card = document.getElementById("videoCard");
const overlay = document.getElementById("overlay");
const count = document.getElementById("count");
const ringProgress = document.getElementById("ringProgress");
const CIRC = 251;
let started = false;

function startRedirect() {
  if (started) return;
  started = true;
  overlay.classList.add("show");

  const total = 3;
  let n = total;
  count.textContent = n;
  ringProgress.style.strokeDashoffset = CIRC;

  requestAnimationFrame(() => {
    ringProgress.style.transition = `stroke-dashoffset ${total}s linear`;
    ringProgress.style.strokeDashoffset = "0";
  });

  const timer = setInterval(() => {
    n--;
    if (n > 0) {
      count.textContent = n;
    } else {
      clearInterval(timer);
      window.location.href = DESTINATION;
    }
  }, 1000);
}

card.addEventListener("click", startRedirect);
card.addEventListener("keydown", e => {
  if (e.key === "Enter" || e.key === " ") {
    e.preventDefault();
    startRedirect();
  }
});
</script>
</body>
</html>
